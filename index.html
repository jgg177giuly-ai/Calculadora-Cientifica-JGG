<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc — Calculadora científica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#050914;
    --bg-1:#0a1224;
    --panel:#0e1830;
    --panel-2:#121e3a;
    --line:#233257;
    --line-soft:#1a2544;
    --text:#e7edfb;
    --text-dim:#7e8bb3;
    --accent-1:#2b6bff;
    --accent-2:#39c9ff;
    --danger:#ff7a7a;
    --radius:22px;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;min-height:100%;}

  body{
    background:
      radial-gradient(1200px 700px at 10% -15%, rgba(43,107,255,0.18), transparent 60%),
      radial-gradient(900px 600px at 105% 110%, rgba(57,201,255,0.09), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 20px 48px;
    -webkit-font-smoothing:antialiased;
  }

  .stage{width:100%;max-width:900px;}

  .topline{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .topline span{color:var(--accent-2);}

  .layout{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
    gap:18px;
    align-items:start;
  }

  .panel{
    background:linear-gradient(165deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 30px 60px -22px rgba(0,0,0,0.7),0 1px 0 rgba(255,255,255,0.04) inset;
  }

  .calc{padding:20px;position:relative;overflow:hidden;}
  .calc::before{
    content:"";position:absolute;top:-45%;left:-15%;width:55%;height:80%;
    background:radial-gradient(circle,rgba(57,201,255,0.10),transparent 70%);
    pointer-events:none;
  }

  /* ---------- Pantalla ---------- */
  .display{
    position:relative;
    background:#060b19;
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:16px 18px 14px;
    margin-bottom:16px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    box-shadow:inset 0 2px 14px rgba(0,0,0,0.55);
  }

  .meta{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .meta b{color:var(--accent-2);font-weight:500;}

  .expr{
    font-family:'JetBrains Mono',monospace;
    font-size:18px;
    line-height:1.45;
    color:var(--text);
    word-break:break-all;
    min-height:26px;
    text-align:right;
  }
  .caret{
    display:inline-block;width:2px;height:18px;vertical-align:-3px;
    background:var(--accent-2);margin-left:1px;animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .result-wrap{margin-top:auto;text-align:right;padding-top:12px;}
  .result-label{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.22em;
    text-transform:uppercase;color:var(--text-dim);
  }
  .result{
    font-family:'JetBrains Mono',monospace;
    font-weight:500;
    font-size:34px;
    line-height:1.2;
    word-break:break-all;
    color:var(--text);
    text-shadow:0 0 22px rgba(57,201,255,0.28);
  }
  .result.error{color:var(--danger);text-shadow:none;font-size:26px;}
  .result.small{font-size:24px;}
  .result.tiny{font-size:18px;}

  .full-precision{
    margin-top:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    word-break:break-all;
  }

  /* ---------- Teclado ---------- */
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;}

  button{
    border:1px solid var(--line-soft);
    border-radius:13px;
    font-family:'Sora',sans-serif;
    font-size:16px;
    font-weight:600;
    padding:14px 0;
    cursor:pointer;
    color:var(--text);
    background:linear-gradient(160deg,#16213f,#101a33);
    box-shadow:0 4px 0 rgba(0,0,0,0.28),0 1px 0 rgba(255,255,255,0.03) inset;
    transition:transform .06s ease,box-shadow .06s ease,background .15s ease,color .15s ease;
  }
  button:hover{background:linear-gradient(160deg,#1b2749,#14203e);}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,0.28);}
  button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}

  .k-fn{
    background:linear-gradient(160deg,#152040,#111a35);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-weight:400;
    font-size:14px;
  }
  .k-fn:hover{color:var(--text);}

  .k-op{
    background:linear-gradient(160deg,#1c2a52,#16213f);
    color:var(--accent-2);
    border-color:rgba(57,201,255,0.18);
  }
  .k-op:hover{background:linear-gradient(160deg,#223260,#192548);}

  .k-danger{color:var(--danger);}

  .k-toggle.on{
    background:linear-gradient(160deg,#1f3a6b,#182b52);
    color:var(--accent-2);
    border-color:rgba(57,201,255,0.35);
  }

  .k-zero{grid-column:span 2;text-align:left;padding-left:24px;}

  .k-equals{
    grid-column:span 5;
    background:linear-gradient(110deg,var(--accent-1),var(--accent-2));
    color:#04101f;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.28em;
    border:none;
    box-shadow:0 4px 0 #0d3ea6,0 0 28px -6px rgba(57,201,255,0.6);
  }
  .k-equals:hover{filter:brightness(1.06);}
  .k-equals:active{transform:translateY(3px);box-shadow:0 1px 0 #0d3ea6;}

  /* ---------- Historial ---------- */
  .history{padding:20px;display:flex;flex-direction:column;max-height:620px;}
  .history-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:12px;border-bottom:1px solid var(--line-soft);margin-bottom:12px;
  }
  .history-head h2{
    margin:0;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.02em;
  }
  .count{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
  }
  .clear-btn{
    background:none;border:none;box-shadow:none;padding:4px 6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;
    color:var(--text-dim);text-transform:uppercase;
  }
  .clear-btn:hover{color:var(--danger);background:none;}
  .clear-btn:active{transform:none;box-shadow:none;}

  .history-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;}
  .history-list::-webkit-scrollbar{width:6px;}
  .history-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

  .entry{
    background:#0a1226;
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    text-align:right;
    transition:border-color .15s ease,background .15s ease;
  }
  .entry:hover{border-color:rgba(57,201,255,0.35);background:#0d1730;}
  .entry .e-expr{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    word-break:break-all;margin-bottom:3px;
  }
  .entry .e-val{
    font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--text);word-break:break-all;
  }
  .entry .e-time{
    font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);
    letter-spacing:0.14em;opacity:.7;margin-top:4px;
  }

  .empty{
    color:var(--text-dim);font-size:13px;line-height:1.6;padding:18px 4px;text-align:center;
  }

  .storage-note{
    margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:0.12em;color:var(--text-dim);opacity:.65;text-transform:uppercase;
  }

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .history{max-height:340px;}
    .result{font-size:28px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="topline">
    <div>Calc <span>—</span> Científica</div>
    <div>Precisión completa</div>
  </div>

  <div class="layout">
    <!-- Calculadora -->
    <section class="panel calc">
      <div class="display">
        <div class="meta">
          <div>Ángulo <b id="angleMode">DEG</b></div>
          <div id="secondFlag">&nbsp;</div>
          <div>Ans <b id="ansPreview">0</b></div>
        </div>

        <div class="expr" id="expr"><span class="caret"></span></div>

        <div class="result-wrap">
          <div class="result-label" id="resultLabel">Resultado</div>
          <div class="result" id="result">0</div>
          <div class="full-precision" id="fullPrecision"></div>
        </div>
      </div>

      <div class="pad">
        <button class="k-fn k-toggle" data-act="second">2ᵈᵃ</button>
        <button class="k-fn k-toggle" data-act="angle">DEG</button>
        <button class="k-fn" data-act="ins" data-txt="(">(</button>
        <button class="k-fn" data-act="ins" data-txt=")">)</button>
        <button class="k-fn k-danger" data-act="back">⌫</button>

        <button class="k-fn" data-act="fn" data-fn="sin" id="btnSin">sin</button>
        <button class="k-fn" data-act="fn" data-fn="cos" id="btnCos">cos</button>
        <button class="k-fn" data-act="fn" data-fn="tan" id="btnTan">tan</button>
        <button class="k-fn" data-act="ins" data-txt="π">π</button>
        <button class="k-fn" data-act="ins" data-txt="e">e</button>

        <button class="k-fn" data-act="fn" data-fn="ln" id="btnLn">ln</button>
        <button class="k-fn" data-act="fn" data-fn="log" id="btnLog">log</button>
        <button class="k-fn" data-act="ins" data-txt="^2" id="btnSq">x²</button>
        <button class="k-fn" data-act="ins" data-txt="^">xʸ</button>
        <button class="k-fn" data-act="fn" data-fn="√" id="btnRoot">√</button>

        <button class="k-fn" data-act="ins" data-txt="^-1" id="btnInv">1/x</button>
        <button class="k-fn" data-act="ins" data-txt="!">n!</button>
        <button class="k-fn" data-act="ins" data-txt="%">%</button>
        <button class="k-fn" data-act="ins" data-txt="mod">mod</button>
        <button class="k-fn" data-act="ins" data-txt="Ans">Ans</button>

        <button class="k-fn k-danger" data-act="clear">AC</button>
        <button data-act="ins" data-txt="7">7</button>
        <button data-act="ins" data-txt="8">8</button>
        <button data-act="ins" data-txt="9">9</button>
        <button class="k-op" data-act="ins" data-txt="÷">÷</button>

        <button class="k-fn" data-act="sign">±</button>
        <button data-act="ins" data-txt="4">4</button>
        <button data-act="ins" data-txt="5">5</button>
        <button data-act="ins" data-txt="6">6</button>
        <button class="k-op" data-act="ins" data-txt="×">×</button>

        <button class="k-fn" data-act="ins" data-txt="E">EXP</button>
        <button data-act="ins" data-txt="1">1</button>
        <button data-act="ins" data-txt="2">2</button>
        <button data-act="ins" data-txt="3">3</button>
        <button class="k-op" data-act="ins" data-txt="−">−</button>

        <button class="k-fn" data-act="save">Guardar</button>
        <button class="k-zero" data-act="ins" data-txt="0">0</button>
        <button data-act="ins" data-txt=".">,</button>
        <button class="k-op" data-act="ins" data-txt="+">+</button>

        <button class="k-equals" data-act="equals">=</button>
      </div>
    </section>

    <!-- Historial -->
    <aside class="panel history">
      <div class="history-head">
        <h2>Historial</h2>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="count" id="count">0</span>
          <button class="clear-btn" data-act="clearHistory">Borrar</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="storage-note" id="storageNote">Guardado activo</div>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= Estado ================= */
  var expr = "";
  var ans = 0;
  var second = false;
  var degrees = true;
  var history = [];
  var lastResult = null;
  var lastError = null;
  var persistent = false;

  var $ = function(id){ return document.getElementById(id); };
  var exprEl = $("expr"), resultEl = $("result"), fullEl = $("fullPrecision");
  var listEl = $("historyList"), countEl = $("count");

  /* ================= Evaluador ================= */
  var FUNCS = {
    "sin":1,"cos":1,"tan":1,"asin":1,"acos":1,"atan":1,
    "ln":1,"log":1,"√":1,"∛":1,"abs":1,"exp":1,"pow10":1
  };

  function factorial(n){
    if(!isFinite(n) || n < 0 || Math.floor(n) !== n || n > 170) return NaN;
    var r = 1;
    for(var i = 2; i <= n; i++) r *= i;
    return r;
  }

  function toRad(x){ return degrees ? x * Math.PI / 180 : x; }
  function fromRad(x){ return degrees ? x * 180 / Math.PI : x; }

  function applyFn(name, x){
    switch(name){
      case "sin": return Math.sin(toRad(x));
      case "cos": return Math.cos(toRad(x));
      case "tan": return Math.tan(toRad(x));
      case "asin": return fromRad(Math.asin(x));
      case "acos": return fromRad(Math.acos(x));
      case "atan": return fromRad(Math.atan(x));
      case "ln": return Math.log(x);
      case "log": return Math.log10(x);
      case "√": return Math.sqrt(x);
      case "∛": return Math.cbrt(x);
      case "abs": return Math.abs(x);
      case "exp": return Math.exp(x);
      case "pow10": return Math.pow(10, x);
    }
    return NaN;
  }

  function evaluate(src){
    var s = src;
    // Autocierre de paréntesis
    var open = 0;
    for(var k = 0; k < s.length; k++){
      if(s[k] === "(") open++;
      else if(s[k] === ")") open--;
    }
    while(open-- > 0) s += ")";

    var i = 0;

    function fail(msg){ throw new Error(msg || "Sintaxis"); }
    function skip(){ while(s[i] === " ") i++; }

    function startsWith(t){ return s.substr(i, t.length) === t; }

    function parseExpr(){
      var v = parseTerm();
      for(;;){
        skip();
        if(s[i] === "+"){ i++; v += parseTerm(); }
        else if(s[i] === "−" || s[i] === "-"){ i++; v -= parseTerm(); }
        else break;
      }
      return v;
    }

    function implicitStart(){
      var c = s[i];
      if(c === undefined) return false;
      if(c === "(" || c === "π" || c === "e" || c === "√" || c === "∛") return true;
      if(startsWith("Ans")) return true;
      for(var f in FUNCS){ if(startsWith(f)) return true; }
      return false;
    }

    function parseTerm(){
      var v = parseUnary();
      for(;;){
        skip();
        if(s[i] === "×" || s[i] === "*"){ i++; v *= parseUnary(); }
        else if(s[i] === "÷" || s[i] === "/"){ i++; var d = parseUnary(); v = (d === 0) ? NaN : v / d; }
        else if(startsWith("mod")){ i += 3; v = v % parseUnary(); }
        else if(implicitStart()){ v *= parseUnary(); }
        else break;
      }
      return v;
    }

    function parseUnary(){
      skip();
      if(s[i] === "−" || s[i] === "-"){ i++; return -parseUnary(); }
      if(s[i] === "+"){ i++; return parseUnary(); }
      return parsePower();
    }

    function parsePower(){
      var base = parsePostfix();
      skip();
      if(s[i] === "^"){
        i++;
        var e = parseUnary();
        return Math.pow(base, e);
      }
      return base;
    }

    function parsePostfix(){
      var v = parsePrimary();
      for(;;){
        skip();
        if(s[i] === "!"){ i++; v = factorial(v); }
        else if(s[i] === "%"){ i++; v = v / 100; }
        else break;
      }
      return v;
    }

    function parsePrimary(){
      skip();
      var c = s[i];
      if(c === undefined) fail("Expresión incompleta");

      if(c === "("){
        i++;
        var v = parseExpr();
        skip();
        if(s[i] === ")") i++;
        return v;
      }
      if(c === "π"){ i++; return Math.PI; }
      if(startsWith("Ans")){ i += 3; return ans; }
      if(c === "e" && !/[0-9]/.test(s[i-1] || "")){ i++; return Math.E; }

      for(var f in FUNCS){
        if(startsWith(f)){
          i += f.length;
          skip();
          var arg;
          if(s[i] === "("){
            i++;
            arg = parseExpr();
            skip();
            if(s[i] === ")") i++;
          } else {
            arg = parseUnary();
          }
          return applyFn(f, arg);
        }
      }

      // número (con notación E)
      var start = i;
      while(i < s.length && /[0-9.]/.test(s[i])) i++;
      if(i < s.length && s[i] === "E"){
        i++;
        if(s[i] === "−" || s[i] === "-" || s[i] === "+") i++;
        while(i < s.length && /[0-9]/.test(s[i])) i++;
      }
      if(i === start) fail("Carácter no válido: " + c);
      var raw = s.slice(start, i).replace("E", "e").replace("−", "-");
      var n = Number(raw);
      if(isNaN(n)) fail("Número no válido");
      return n;
    }

    var value = parseExpr();
    skip();
    if(i < s.length) fail("Sintaxis");
    return value;
  }

  /* ================= Formato ================= */
  function clean(x){
    if(!isFinite(x)) return null;
    if(Number.isInteger(x) && Math.abs(x) < 1e21) return String(x);
    var p = Number(x.toPrecision(14));
    var out = String(p);
    if(/e/i.test(out)) out = p.toExponential();
    return out;
  }

  function fullPrecision(x){
    if(!isFinite(x)) return "";
    var full = String(x);
    var short = clean(x);
    if(full === short) return "";
    return "sin redondear · " + formatNum(full);
  }

  // 1234567.89  ->  1.234.567,89
  function groupInt(intPart){
    var neg = intPart.charAt(0) === "-" || intPart.charAt(0) === "−";
    var digits = neg ? intPart.slice(1) : intPart;
    digits = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "−" : "") + digits;
  }

  function formatNum(str){
    if(str === null || str === undefined || str === "") return str;
    var m = String(str).match(/^([-−]?)(\d*)(?:\.(\d*))?(?:[eE]([+\-−]?\d+))?$/);
    if(!m) return String(str);
    var sign = m[1] === "-" ? "−" : m[1];
    var out = groupInt(m[2] || "0");
    if(m[3] !== undefined) out += "," + m[3];
    if(m[4] !== undefined) out += "E" + m[4].replace("-", "−");
    return sign + out;
  }

  // Formatea sólo los números dentro de la expresión, dejando funciones y operadores intactos
  var NUM_RE = /(?:\d+(?:\.\d*)?|\.\d+)(?:E[+\-−]?\d*)?/g;
  function formatExpr(src){
    return src.replace(NUM_RE, function(match){
      var parts = match.split("E");
      var mant = parts[0];
      var exp = parts.length > 1 ? parts[1] : null;
      var mp = mant.split(".");
      var out = groupInt(mp[0] || "");
      if(mp.length > 1) out += "," + mp[1];
      if(exp !== null) out += "E" + exp.replace("-", "−");
      return out;
    });
  }

  function sizeClass(str){
    if(str.length > 26) return "result tiny";
    if(str.length > 16) return "result small";
    return "result";
  }

  /* ================= Render ================= */
  function render(){
    exprEl.innerHTML = escapeHtml(formatExpr(expr)) + '<span class="caret"></span>';
    $("angleMode").textContent = degrees ? "DEG" : "RAD";
    $("secondFlag").innerHTML = second ? "<b>2ᵈᵃ activa</b>" : "&nbsp;";
    $("ansPreview").textContent = formatNum(clean(ans)) || "0";

    if(expr.trim() === ""){
      resultEl.className = "result";
      resultEl.textContent = "0";
      fullEl.textContent = "";
      return;
    }

    try{
      var v = evaluate(expr);
      if(!isFinite(v)) throw new Error(isNaN(v) ? "Indefinido" : "Infinito");
      lastResult = v;
      lastError = null;
      var str = formatNum(clean(v));
      resultEl.className = sizeClass(str);
      resultEl.textContent = str;
      fullEl.textContent = fullPrecision(v);
    }catch(err){
      lastResult = null;
      lastError = err.message;
      resultEl.className = "result error";
      resultEl.textContent = err.message;
      fullEl.textContent = "";
    }
  }

  function escapeHtml(t){
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function renderHistory(){
    countEl.textContent = history.length;
    if(history.length === 0){
      listEl.innerHTML = '<div class="empty">Todavía no hay cálculos guardados.<br>Pulsá <b>=</b> o <b>Guardar</b> y aparecerán acá.</div>';
      return;
    }
    listEl.innerHTML = "";
    history.forEach(function(h, idx){
      var el = document.createElement("div");
      el.className = "entry";
      el.setAttribute("role","button");
      el.setAttribute("tabindex","0");
      el.title = "Insertar este resultado";
      el.innerHTML =
        '<div class="e-expr">' + escapeHtml(formatExpr(h.expr)) + '</div>' +
        '<div class="e-val">' + escapeHtml(formatNum(h.value)) + '</div>' +
        '<div class="e-time">' + h.time + '</div>';
      var use = function(){
        expr += h.value;
        render();
      };
      el.addEventListener("click", use);
      el.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); use(); }
      });
      listEl.appendChild(el);
    });
  }

  /* ================= Guardado ================= */
  var KEY = "calc:history";

  function saveStore(){
    if(!persistent) return;
    try{ localStorage.setItem(KEY, JSON.stringify(history.slice(0, 60))); }
    catch(e){ /* seguimos en memoria */ }
  }

  function loadStore(){
    try{
      if(typeof localStorage === "undefined") throw new Error("no-storage");
      persistent = true;
      var raw = localStorage.getItem(KEY);
      if(raw){
        try{ history = JSON.parse(raw) || []; }catch(e){ history = []; }
      }
      $("storageNote").textContent = "Guardado permanente activo";
    }catch(e){
      persistent = false;
      $("storageNote").textContent = "Guardado en esta sesión";
    }
    renderHistory();
  }

  function pushHistory(exprText, value){
    var d = new Date();
    var time = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    if(history[0] && history[0].expr === exprText && history[0].value === value) return;
    history.unshift({ expr: exprText, value: value, time: time });
    if(history.length > 60) history.pop();
    renderHistory();
    saveStore();
  }

  /* ================= Acciones ================= */
  function insert(txt){
    expr += txt;
    render();
  }

  function backspace(){
    var multi = ["asin(","acos(","atan(","pow10(","sin(","cos(","tan(","abs(","exp(","log(","mod","Ans","ln(","^-1","^2"];
    for(var i = 0; i < multi.length; i++){
      if(expr.endsWith(multi[i])){
        expr = expr.slice(0, -multi[i].length);
        render();
        return;
      }
    }
    expr = expr.slice(0, -1);
    render();
  }

  function clearAll(){
    expr = "";
    render();
  }

  function toggleSign(){
    if(expr === "") { expr = "−"; }
    else if(expr.startsWith("−")) expr = expr.slice(1);
    else expr = "−" + expr;
    render();
  }

  function equals(){
    if(expr.trim() === "") return;
    try{
      var v = evaluate(expr);
      if(!isFinite(v)) throw new Error(isNaN(v) ? "Indefinido" : "Infinito");
      ans = v;
      pushHistory(expr, clean(v));
      expr = clean(v);
      render();
      $("resultLabel").textContent = "Resultado guardado";
      setTimeout(function(){ $("resultLabel").textContent = "Resultado"; }, 1400);
    }catch(err){
      render();
    }
  }

  function saveCurrent(){
    if(lastResult === null) return;
    ans = lastResult;
    pushHistory(expr, clean(lastResult));
    $("resultLabel").textContent = "Guardado";
    setTimeout(function(){ $("resultLabel").textContent = "Resultado"; }, 1400);
  }

  function setSecond(on){
    second = on;
    $("btnSin").textContent = on ? "sin⁻¹" : "sin";
    $("btnCos").textContent = on ? "cos⁻¹" : "cos";
    $("btnTan").textContent = on ? "tan⁻¹" : "tan";
    $("btnLn").textContent  = on ? "eˣ" : "ln";
    $("btnLog").textContent = on ? "10ˣ" : "log";
    $("btnSq").textContent  = on ? "x³" : "x²";
    $("btnRoot").textContent= on ? "∛" : "√";
    $("btnInv").textContent = on ? "|x|" : "1/x";
    render();
  }

  var FN_MAP = {
    "sin":["sin(","asin("],
    "cos":["cos(","acos("],
    "tan":["tan(","atan("],
    "ln":["ln(","exp("],
    "log":["log(","pow10("],
    "√":["√(","∛("]
  };

  var INS_MAP = {
    "^2":["^2","^3"],
    "^-1":["^-1","abs("]
  };

  /* ================= Eventos ================= */
  document.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){
      var act = btn.dataset.act;
      if(act === "ins"){
        var t = btn.dataset.txt;
        if(second && INS_MAP[t]){
          t = INS_MAP[t][1];
          setSecond(false);
          document.querySelector('[data-act="second"]').classList.remove("on");
        }
        insert(t);
      }
      else if(act === "fn"){
        var pair = FN_MAP[btn.dataset.fn];
        insert(second ? pair[1] : pair[0]);
        if(second){
          setSecond(false);
          document.querySelector('[data-act="second"]').classList.remove("on");
        }
      }
      else if(act === "back") backspace();
      else if(act === "clear") clearAll();
      else if(act === "sign") toggleSign();
      else if(act === "equals") equals();
      else if(act === "save") saveCurrent();
      else if(act === "second"){
        btn.classList.toggle("on");
        setSecond(btn.classList.contains("on"));
      }
      else if(act === "angle"){
        degrees = !degrees;
        btn.textContent = degrees ? "DEG" : "RAD";
        btn.classList.toggle("on", !degrees);
        render();
      }
      else if(act === "clearHistory"){
        history = [];
        renderHistory();
        saveStore();
      }
    });
  });

  window.addEventListener("keydown", function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if(/^[0-9]$/.test(k)) insert(k);
    else if(k === "." || k === ",") insert(".");
    else if(k === "+") insert("+");
    else if(k === "-") insert("−");
    else if(k === "*") insert("×");
    else if(k === "/"){ e.preventDefault(); insert("÷"); }
    else if(k === "^") insert("^");
    else if(k === "(" || k === ")") insert(k);
    else if(k === "!") insert("!");
    else if(k === "%") insert("%");
    else if(k === "Enter" || k === "="){ e.preventDefault(); equals(); }
    else if(k === "Backspace"){ e.preventDefault(); backspace(); }
    else if(k === "Escape") clearAll();
  });

  /* ================= Inicio ================= */
  loadStore();
  render();
})();
</script>

</body>
</html>
